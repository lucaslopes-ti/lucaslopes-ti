<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Lucas Lopes, Software and Data Engineer">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0F1A"/><stop offset="1" stop-color="#111827"/></linearGradient>
  <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#818CF8"/></linearGradient>
  <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6"><stop offset="0" stop-color="#818CF8" stop-opacity="0.18"/><stop offset="1" stop-color="#818CF8" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1F2937" stroke-width="1"/></pattern>
  <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0"><stop offset="0.35" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="0.9"/></linearGradient>
  <mask id="m"><rect width="1200" height="320" fill="url(#fadeR)"/></mask>
  <style>
    .pulse{animation:p 2.4s ease-in-out infinite}
    @keyframes p{0%,100%{opacity:1}50%{opacity:.35}}
  </style>
</defs>
<rect width="1200" height="320" rx="18" fill="url(#bg)"/>
<rect width="1200" height="320" rx="18" fill="url(#grid)" mask="url(#m)"/>
<rect width="1200" height="320" rx="18" fill="url(#glow)"/>
